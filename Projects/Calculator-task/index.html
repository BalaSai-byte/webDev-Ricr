<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        background-image: url(https://learn.ricr.in/pluginfile.php/6753/mod_page/content/8/CalculatorBGImage.png);
      }

      .displayResult{
        background: #D1E7DD;
      }

      .inputArea{
         background: #F8D7DA;
      }
    </style>
  </head>
  <body>
    <div class="d-flex justify-content-center">
      <div class="border border-1 rounded-4 m-1 w-auto   border-black mt-4 p-2 ">
        <div class="displayResult border border-1 rounded-top-4 border-black h-25 d-flex justify-content-end align-items-center p-1">0
        </div>

        <div class="inputArea border border-1 rounded-bottom-4 my-2 border-black mb-5 ">
            <div class="mx-2 table row-cols-5 my-2">
                <button class="btn btn-light rounded-5 ">AC</button>
                <button class="btn btn-light rounded-5  ">C</button>
                <button class="btn btn-light rounded-5  ">%</button>
                <button class="btn btn-warning rounded-5 ">/</button>
            </div>
            <div class="mx-2 table row-cols-5 my-2">
                <button class="btn btn-light rounded-5 p-1">7</button>
                <button class="btn btn-light rounded-5 p-1">8</button>
                <button class="btn btn-light rounded-5 p-1">9</button>
                <button class="btn btn-warning rounded-5 p-1">*</button>
            </div>
            <div  class="mx-2 table row-cols-5 my-2">
                <button class="btn btn-light rounded-5 p-1">4</button>
                <button class="btn btn-light rounded-5 p-1">5</button>
                <button class="btn btn-light rounded-5 p-1">6</button>
                <button class="btn btn-warning rounded-5 p-1">-</button>
            </div>
            <div  class="mx-2 table row-cols-5 my-2">
                <button class="btn btn-light rounded-5 p-1">1</button>
                <button class="btn btn-light rounded-5 p-1">2</button>
                <button class="btn btn-light rounded-5 p-1">3</button>
                <button class="btn btn-light rounded-5 p-1">+</button>
            </div>
            <div  class="mx-2 table row-cols-5 my-2">
                <button class="btn btn-light rounded-5 p-1">0</button>
                <button class="btn btn-light rounded-5 p-1">.</button>
                <button class="btn btn-light rounded-5 p-1">=</button>
                
            </div>
        </div>
      </div>

      
      </div>
      
    

    <!-- BootStrap Script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
